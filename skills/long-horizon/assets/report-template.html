<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long Horizon</title>
<style>
/* Long Horizon report template. Layout: the dependency graph is the body (swim lanes, dependency order left to right),
   a "needs you" inbox above it, details in a slide-in drawer, spec / activity / list in tabs below.
   System fonts only and no external requests: the file must open straight from file://.
   Do not edit this markup during a run. Refresh only the lh-data block; write lh-labels once at admission. */
:root {
  --bg: #f7f6f3;
  --canvas: #fbfaf8;
  --surface: #ffffff;
  --surface-2: #f1efea;
  --line: #e6e3dc;
  --edge: #cfcac0;
  --fg: #1d1c1a;
  --fg-2: #55524c;
  --fg-3: #8a867e;
  --brand: #c4623f;
  --ok: #2e8b57;
  --run: #3b6fd4;
  --wait: #b7791f;
  --bad: #c03b35;
  --idle: #aaa59b;
  --shadow: 0 1px 2px rgba(29, 28, 26, 0.05);
  --shadow-lg: 0 12px 32px -12px rgba(29, 28, 26, 0.18);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1917; --canvas: #1e1d1b; --surface: #242320; --surface-2: #2c2b28; --line: #363430; --edge: #4d4a45;
    --fg: #edebe6; --fg-2: #b5b1a8; --fg-3: #8a867e;
    --brand: #e07a55; --ok: #4fb37c; --run: #6d9cf2; --wait: #e0a24a; --bad: #e5675f; --idle: #6b675f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-lg: 0 16px 40px -14px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1917; --canvas: #1e1d1b; --surface: #242320; --surface-2: #2c2b28; --line: #363430; --edge: #4d4a45;
  --fg: #edebe6; --fg-2: #b5b1a8; --fg-3: #8a867e;
  --brand: #e07a55; --ok: #4fb37c; --run: #6d9cf2; --wait: #e0a24a; --bad: #e5675f; --idle: #6b675f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-lg: 0 16px 40px -14px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--font-mono); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 24px; padding-block: 24px 56px; display: grid; gap: 18px; }

/* Status colours */
.s-passed { --c: var(--ok); }
.s-in-flight { --c: var(--run); }
.s-blocked { --c: var(--wait); }
.s-failed { --c: var(--bad); }
.s-ready { --c: var(--fg-2); }
.s-pending { --c: var(--idle); }

/* Header: brand row + goal row. The bottom edge is the horizon: one tick per item, coloured by status,
   with a dot marking overall progress. Restraint first: no gradients, no ambient animation. */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px 0; display: grid; gap: 14px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.mark { width: 20px; height: 20px; flex: none; color: var(--fg); }
.brand .hi { --icon-accent: var(--brand); }
.mark .sun { color: var(--brand); }
.word { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.word b { font-size: 12px; letter-spacing: 0.18em; font-weight: 650; }
.word span { font-size: 12px; color: var(--fg-3); }
.hero .tools { margin-left: auto; }
.horizon { position: relative; height: 20px; margin: 0 -20px; }
.horizon svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* Goal row */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.ring { width: 52px; height: 52px; flex: none; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-2); }
.ring .val { stroke: var(--ok); stroke-linecap: round; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.title { min-width: 0; flex: 1 1 360px; display: grid; gap: 4px; }
.title h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em; text-wrap: balance; }
.sub { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--fg-3); align-items: center; }
.phase { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; background: color-mix(in srgb, var(--pc) 16%, transparent); color: var(--pc); }
.phase i { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.cnt { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s, background .15s; }
.cnt:hover { border-color: var(--c); }
.cnt b { font-size: 16px; font-weight: 650; color: var(--c); font-variant-numeric: tabular-nums; }
.cnt span { font-size: 12px; color: var(--fg-2); }
.tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: 12px; color: var(--fg-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }

/* Hand-drawn icons (ink + fill alpha masks): ink follows the text colour, the fill uses --icon-accent */
.hi { position: relative; display: inline-block; width: var(--sz, 20px); height: var(--sz, 20px); flex: none; vertical-align: middle; }
.hi::before, .hi::after { content: ""; position: absolute; inset: 0; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.hi::before { background: var(--icon-accent, var(--brand)); -webkit-mask-image: var(--fill); mask-image: var(--fill); }
.hi::after { background: currentColor; -webkit-mask-image: var(--ink); mask-image: var(--ink); }

/* Needs-you inbox: one card, one row per item, a tinted icon tile per kind */
.inbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 4px 6px 6px; }
.inbox-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.inbox-head h2 { margin: 0; font-size: 13.5px; font-weight: 650; }
.inbox-head .n { font-size: 11.5px; font-weight: 650; color: var(--wait); background: color-mix(in srgb, var(--wait) 12%, transparent); border-radius: 99px; padding: 0 8px; line-height: 19px; }
.inbox-head .hint { font-size: 12px; color: var(--fg-3); margin-left: auto; }
.inbox-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 2px 8px; }
.ask { display: grid; grid-template-columns: 38px minmax(0, 1fr) 16px; gap: 12px; align-items: start; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 10px 10px 11px; cursor: pointer; transition: background .15s; }
.ask:hover { background: var(--surface-2); }
.ask .tile { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: var(--k); background: color-mix(in srgb, var(--k) 10%, transparent); --icon-accent: var(--k); }
.ask .tile .hi { color: var(--fg); }
.ask .tile svg { width: 19px; height: 19px; }
.ask .body { display: grid; gap: 2px; min-width: 0; }
.ask .t { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.ask .q { font-weight: 600; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask .meta { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.ask .meta .mono { color: var(--fg-2); }
.ask .r { font-size: 12.5px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ask .r b { color: var(--fg); font-weight: 600; }
.ask .go { color: var(--fg-3); margin-top: 8px; opacity: 0; transform: translateX(-3px); transition: opacity .15s, transform .15s; }
.ask .go svg { width: 16px; height: 16px; }
.ask:hover .go, .ask:focus-visible .go { opacity: 1; transform: none; }
.k-decide { --k: var(--wait); }
.k-act { --k: var(--brand); }
.k-retry { --k: var(--bad); }
.k-spec { --k: var(--run); }
.attn-empty { padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--ok) 10%, var(--surface)); color: var(--ok); font-weight: 600; font-size: 13px; }

/* Dependency graph */
.board { background: var(--canvas); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.board-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; padding: 14px 18px 4px; }
.board-head .hint { font-size: 12px; color: var(--fg-3); margin-left: 10px; }
.board-head h2 { margin: 0; font-size: 13.5px; color: var(--fg); font-weight: 650; display: inline; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.legend .crit-key { width: 16px; height: 0; border-top: 2px solid var(--brand); border-radius: 0; background: none; }
.graph-scroll { overflow-x: auto; overflow-y: hidden; padding: 6px 0 10px; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--fg-3) 30%, transparent) transparent; }
.graph-scroll::-webkit-scrollbar { height: 6px; }
.graph-scroll::-webkit-scrollbar-track { background: transparent; margin-inline: 18px; }
.graph-scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg-3) 30%, transparent); border-radius: 99px; }
.graph-scroll::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--fg-3) 55%, transparent); }
.graph-fit { position: relative; }
.graph { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.graph svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.lane { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--lc) 3%, transparent); }
.lane::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--lc); opacity: .75; }
.lane-label { position: absolute; left: 14px; top: 11px; display: grid; gap: 1px; width: 92px; }
.lane-label b { font-size: 12px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 4px; margin-left: -4px; }
.lane-label b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lc); }
.lane-label b.has-ic::before { display: none; }
.lane-label .hi { --icon-accent: var(--lc); }
.lane-label span { font-size: 10.5px; color: var(--fg-3); line-height: 1.35; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.edge.done { stroke: color-mix(in srgb, var(--ok) 55%, var(--edge)); }
.edge.flow { stroke: color-mix(in srgb, var(--run) 70%, var(--edge)); stroke-width: 1.6; stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
.edge.wait { stroke: color-mix(in srgb, var(--wait) 65%, var(--edge)); stroke-dasharray: 3 5; }
.edge.crit { stroke: var(--brand); stroke-width: 1.8; }
.edge.crit.flow { stroke: var(--brand); }
@keyframes flow { to { stroke-dashoffset: -20; } }
.graph.focus .edge:not(.hl) { opacity: .12; }
.graph.focus .node:not(.hl) { opacity: .28; filter: saturate(.4); }
.node { position: absolute; width: 164px; height: 64px; border-radius: 10px; text-align: left; padding: 7px 10px; display: grid; align-content: start; gap: 2px; line-height: 1.3; cursor: pointer; border: 1px solid var(--line); border-top: 2px solid var(--c); background: var(--surface); box-shadow: var(--shadow); transition: opacity .2s, filter .2s, border-color .2s; }
.node:hover { border-color: var(--c); z-index: 3; }
.node.s-pending { border-top-style: dashed; color: var(--fg-2); }

.node.s-blocked, .node.s-failed { background: color-mix(in srgb, var(--c) 5%, var(--surface)); border-color: color-mix(in srgb, var(--c) 35%, var(--line)); }
.node.crit { box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--brand) 50%, transparent); }
.node.sel { outline: 2px solid var(--fg); outline-offset: 2px; }
.node .r1 { display: flex; align-items: center; gap: 5px; font-size: 10.5px; min-width: 0; }
.node .r1 .id { font-family: var(--font-mono); font-weight: 600; color: var(--fg-2); }
.node .r1 .stt { color: var(--c); font-weight: 600; }
.node .r1 .tags { margin-left: auto; display: flex; gap: 4px; }
.node .ttl { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .meta { font-size: 10.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ic { width: 12px; height: 12px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--surface); background: var(--c); font-size: 8px; font-weight: 800; }
.s-pending .ic { background: transparent; border: 1.5px dashed var(--c); }
.s-ready .ic { background: transparent; border: 1.5px solid var(--c); }
.s-in-flight .ic { background: transparent; border: 2px solid color-mix(in srgb, var(--c) 30%, transparent); border-top-color: var(--c); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tag { font-size: 10px; font-weight: 600; padding: 0 5px; border-radius: 4px; line-height: 16px; }
.tag.cut { background: color-mix(in srgb, var(--wait) 22%, transparent); color: var(--wait); }
.tag.human { background: color-mix(in srgb, var(--brand) 18%, transparent); color: var(--brand); }
.tag.new { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.crit-line { padding: 2px 18px 14px; font-size: 12px; color: var(--fg-3); }
.crit-line .mono { color: var(--brand); font-weight: 650; }

/* Detail drawer */
.scrim { position: fixed; inset: 0; background: rgba(20, 19, 17, 0.24); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); transform: translateX(104%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 21; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
.drawer.on { transform: none; }
.dh { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; background: var(--surface); border-top: 2px solid var(--c); }
.dh .row { display: flex; align-items: center; gap: 8px; }
.dh h3 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
.x { margin-left: auto; border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: 16px; color: var(--fg-2); }
.db { overflow: auto; padding: 16px 20px 28px; display: grid; gap: 16px; align-content: start; }
.blk .lbl { font-size: 11.5px; font-weight: 600; color: var(--fg-3); margin-bottom: 6px; }
.verify { font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; white-space: pre-wrap; word-break: break-word; }
.askbox { border-radius: 12px; padding: 11px 13px; background: color-mix(in srgb, var(--wait) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--wait) 40%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; padding: 3px 9px; font-size: 12px; border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: color-mix(in srgb, var(--c) 10%, var(--surface)); cursor: pointer; }
.chip .mono { font-weight: 650; }
.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ev li { position: relative; padding-left: 16px; font-size: 13px; color: var(--fg-2); }
.ev li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--idle)); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.gchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--lc); font-weight: 600; }
.gchip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--lc); }
.links a { color: var(--brand); font-size: 13px; margin-right: 12px; }
.empty { color: var(--fg-3); font-size: 13px; }

/* Tabs */
.tabs { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.tabbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabbar button { border: 0; background: transparent; padding: 9px 12px 10px; font-size: 13px; color: var(--fg-3); cursor: pointer; border-bottom: 2.5px solid transparent; display: inline-flex; gap: 6px; align-items: center; }
.tabbar button i { width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.tabbar button[aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--fg); }
.panel { padding: 16px 18px 20px; }
.dw { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.dw li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.ck { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--idle); display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; }
.ck.on { background: var(--ok); border-color: var(--ok); }
.dw .chk { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-3); }
.bar { width: 120px; height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 7px; }
.bar span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.box { border-radius: 14px; padding: 12px 14px; background: color-mix(in srgb, var(--bc) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bc) 25%, var(--line)); }
.box h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--bc); }
.box ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--fg-2); display: grid; gap: 4px; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tl li { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 12px; font-size: 13px; }
.tl .when { color: var(--fg-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.kind { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-right: 6px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11.5px; color: var(--fg-3); font-weight: 650; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
.raw { max-height: 360px; overflow: auto; background: var(--surface-2); border-radius: 12px; padding: 12px; font: 11.5px/1.5 var(--font-mono); white-space: pre; margin: 10px 0 0; }
@media (max-width: 640px) { .tl li { grid-template-columns: minmax(0, 1fr); gap: 0; } .tools { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="scrim" id="scrim"></div>

<script>
(() => {
  const read = (id) => { try { return JSON.parse(document.getElementById(id).textContent) } catch { return null } }
  // UI text lives in the lh-labels block, written once at admission in the session's language; refreshes touch only lh-data
  const L = read("lh-labels") || {}
  const t = (key, vars) => {
    const raw = key.split(".").reduce((o, k) => (o == null ? o : o[k]), L)
    const s = raw == null ? key : String(raw)
    return vars ? s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? "")) : s
  }
  if (L.lang) document.documentElement.lang = L.lang

  const SVG = (body) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`
  const FALLBACK_ICONS = {
    decide: SVG('<circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.3-2.7 4.1"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/>'),
    chevron: SVG('<path d="m9.5 6 6 6-6 6"/>')
  }
  // Hand-drawn icons (lh-icons block, ink + fill masks): each registers its CSS variables once
  const IMG = read("lh-icons") || {}
  {
    const st = document.createElement("style")
    st.textContent = Object.entries(IMG).map(([k, v]) => `.hi-${k}{--ink:url(${v.ink});--fill:url(${v.fill})}`).join("")
    document.head.appendChild(st)
  }
  const icon = (k, size) => IMG[k] ? `<span class="hi hi-${k}" style="--sz:${size || 20}px" aria-hidden="true"></span>` : (FALLBACK_ICONS[k] || FALLBACK_ICONS.decide)
  const ICON = { "passed": "✓", "blocked": "!", "failed": "✕", "in-flight": "", "ready": "", "pending": "" }
  const ORDER = ["blocked", "failed", "in-flight", "ready", "pending", "passed"]
  const PHASE_COLOR = { draft: "var(--fg-3)", running: "var(--run)", review: "var(--wait)", stopped: "var(--ok)" }
  const LOG_COLOR = { dispatch: "var(--run)", verify: "var(--ok)", fail: "var(--bad)", blocked: "var(--wait)", session: "var(--brand)", spec: "var(--fg-3)" }
  const FALLBACK_HUES = ["#8b7fd1", "#c66f99", "#3a9a8d", "#6383cf", "#cf8a46", "#9b968c"]
  const ST = (s) => t(`status.${s}`)

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])
  const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } }
  const DATA = read("lh-data")
  let tab = store.get("lh.tab") || "done"
  let selected = null
  const theme = store.get("lh.theme")
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme

  function model(d) {
    const items = (d.ledger || []).map((it) => ({ ...it, st: it.passes ? "passed" : ["in-flight", "blocked", "failed"].includes(it.status) ? it.status : it.question ? "blocked" : "pending" }))
    const get = new Map(items.map((it) => [it.id, it]))
    for (const it of items) if (it.st === "pending" && (it.deps || []).every((x) => get.get(x)?.st === "passed")) it.st = "ready"
    const order = [], mark = new Map()
    const visit = (id) => { if (mark.get(id) || !get.has(id)) return; mark.set(id, 1); for (const dep of get.get(id).deps || []) visit(dep); order.push(id) }
    items.forEach((it) => visit(it.id))
    const level = new Map()
    for (const id of order) { const ds = (get.get(id).deps || []).filter((x) => get.has(x)); level.set(id, ds.length ? 1 + Math.max(...ds.map((x) => level.get(x))) : 0) }
    const children = new Map(items.map((it) => [it.id, []]))
    for (const it of items) for (const dep of it.deps || []) children.get(dep)?.push(it.id)
    const walk = (start, next) => { const seen = new Set(), st = [...next(start)]; while (st.length) { const c = st.pop(); if (seen.has(c)) continue; seen.add(c); st.push(...next(c)) } return seen }
    const down = (id) => walk(id, (x) => children.get(x) || [])
    const up = (id) => walk(id, (x) => (get.get(x)?.deps || []).filter((y) => get.has(y)))
    // Critical path: the longest chain over unfinished items (weighted by est hours, default 1)
    const best = new Map(), prev = new Map()
    for (const id of order) {
      const it = get.get(id)
      if (it.st === "passed") { best.set(id, 0); continue }
      let b = 0, p = null
      for (const dep of it.deps || []) { const v = best.get(dep) || 0; if (v > b) { b = v; p = dep } }
      best.set(id, b + (Number(it.est) || 1)); prev.set(id, b ? p : null)
    }
    let end = null, endV = 0
    for (const [id, v] of best) if (v > endV) { endV = v; end = id }
    const crit = []
    for (let cur = end; cur; cur = prev.get(cur)) crit.unshift(cur)
    // Bottlenecks: unfinished items holding back the most unfinished descendants
    const blocking = new Map()
    for (const it of items) if (it.st !== "passed") blocking.set(it.id, [...down(it.id)].filter((c) => get.get(c).st !== "passed").length)
    const maxB = Math.max(0, ...blocking.values())
    const cuts = new Set([...blocking].filter(([, n]) => n >= 3 && n >= maxB * 0.5).map(([id]) => id))
    const counts = Object.fromEntries(ORDER.map((s) => [s, items.filter((it) => it.st === s).length]))
    const groups = (d.groups && d.groups.length ? d.groups : [{ id: "_", label: t("group_all") }]).map((g, i) => ({ ...g, color: g.color || FALLBACK_HUES[i % FALLBACK_HUES.length] }))
    const gOf = (it) => groups.find((g) => g.id === it.group) || groups[groups.length - 1]
    return { d, items, get, order, level, children, down, up, crit, critSet: new Set(crit), blocking, cuts, counts, groups, gOf }
  }

  function header(m) {
    const g = m.d.goal || {}, total = m.items.length, done = m.counts.passed
    const R = 24, C = 2 * Math.PI * R, pct = total ? done / total : 0
    const human = m.items.filter((it) => it.human && it.st !== "passed" && it.st !== "blocked").length
    const cnt = (st, n, label) => n ? `<button type="button" class="cnt s-${st}" data-jump="${st}"><b>${n}</b><span>${esc(label)}</span></button>` : ""
    // Horizon: one tick per item in dependency order; the dot marks overall progress
    const seq = m.order.map((id) => m.get.get(id))
    const gap = 0.6, segW = seq.length ? (100 - gap * (seq.length + 1)) / seq.length : 0
    const ticks = seq.map((it, i) => {
      const tall = it.st === "in-flight" || it.st === "blocked" || it.st === "failed"
      return `<rect class="tick s-${it.st}" x="${gap + i * (segW + gap)}%" y="${tall ? 7 : 8.5}" width="${segW}%" height="${tall ? 6 : 4}" rx="2" style="fill:var(--c);opacity:${it.st === "pending" ? 0.35 : 1}"><title>${esc(it.id)} ${esc(it.title)} · ${esc(ST(it.st))}</title></rect>`
    }).join("")
    const markX = 0.6 + pct * 98.8
    const th = document.documentElement.dataset.theme
    return `
      <header class="hero">
        <div class="brand">
          ${IMG.horizon ? icon("horizon", 32) : `<svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><path class="sun" d="M5 14a6 6 0 0 1 12 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2 14h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".45"/></svg>`}
          <div class="word"><b>LONG HORIZON</b><span>${esc(t("brand_sub"))}</span></div>
          <div class="tools">
            <div class="seg" role="group" aria-label="${esc(t("theme.label"))}"><button type="button" data-theme-set="light" aria-pressed="${th === "light"}">${esc(t("theme.light"))}</button><button type="button" data-theme-set="system" aria-pressed="${!th}">${esc(t("theme.auto"))}</button><button type="button" data-theme-set="dark" aria-pressed="${th === "dark"}">${esc(t("theme.dark"))}</button></div>
          </div>
        </div>
        <div class="top">
          <div class="ring" aria-label="${esc(t("count_passed", { total }))} ${done}">
            <svg width="58" height="58" viewBox="0 0 58 58"><circle class="track" cx="29" cy="29" r="${R}" fill="none" stroke-width="5"/><circle class="val" cx="29" cy="29" r="${R}" fill="none" stroke-width="5" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="--full:${C}"/></svg>
            <b>${Math.round(pct * 100)}%</b>
          </div>
          <div class="title">
            <h1>${esc(g.title)}</h1>
            <div class="sub"><span class="phase ${esc(g.phase)}" style="--pc:${PHASE_COLOR[g.phase] || "var(--fg-3)"}"><i></i>${esc(t(`phase.${g.phase}`))}</span><span class="mono">${esc(g.slug)}</span>${g.repo ? `<span>${esc(g.repo)}${g.base ? ` → ${esc(g.base)}` : ""}</span>` : ""}<span>${esc(t("sessions", { n: g.sessions ?? 0 }))}</span><span>${esc(t("updated", { t: g.updated || "" }))}</span></div>
          </div>
          <div class="counts">
            ${cnt("passed", done, t("count_passed", { total }))}${cnt("in-flight", m.counts["in-flight"], ST("in-flight"))}${cnt("blocked", m.counts.blocked + human + (m.d.open_questions || []).length, ST("blocked"))}${cnt("failed", m.counts.failed, ST("failed"))}${cnt("ready", m.counts.ready, ST("ready"))}
          </div>
        </div>
        <div class="horizon" aria-hidden="true">
          <svg>
            <rect x="0" y="10" width="100%" height="1" fill="var(--line)"/>
            ${ticks}
            <circle cx="${markX}%" cy="10.5" r="4.5" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/>
          </svg>
        </div>
      </header>`
  }

  function attention(m) {
    const rows = []
    const row = (kind, k, title, meta, text, open) => `
      <button type="button" class="ask k-${kind}" ${open ? `data-open="${esc(open)}"` : ""}>
        <span class="tile" aria-hidden="true">${icon(k, 32)}</span>
        <span class="body"><span class="t"><span class="q">${esc(title)}</span><span class="meta">${meta}</span></span><span class="r">${text}</span></span>
        <span class="go" aria-hidden="true">${icon("chevron")}</span>
      </button>`
    for (const q of m.d.open_questions || []) {
      rows.push(row("spec", "spec", q.text, `${esc(q.asking ? t("q_asking") : t("q_pending"))} · <span class="mono">${esc(q.id)}</span>`, `<b>${esc(t("recommend"))}</b>${esc(q.recommend)}`, q.blocks?.[0]))
    }
    const asked = new Set((m.d.open_questions || []).flatMap((q) => q.blocks || []))
    for (const it of m.items) {
      const human = it.human && it.st !== "passed" && it.st !== "blocked" && it.st !== "failed"
      if (!(it.st === "blocked" || it.st === "failed" || (human && !asked.has(it.id)))) continue
      const n = m.blocking.get(it.id) || 0
      const kind = it.st === "failed" ? "retry" : it.human ? "act" : "decide"
      rows.push(row(kind, kind, it.title, `${esc(t(`kind.${kind}`))} · <span class="mono">${esc(it.id)}</span>${n ? ` · ${esc(t("blocks_n", { n }))}` : ""}`, esc(it.question || (it.evidence || []).slice(-1)[0] || it.desc), it.id))
    }
    if (!rows.length) return `<div class="attn-empty">${esc(t("inbox_empty"))}</div>`
    return `<section class="inbox" aria-label="${esc(t("inbox_title"))}"><div class="inbox-head"><h2>${esc(t("inbox_title"))}</h2><span class="n">${rows.length}</span><span class="hint">${esc(t("inbox_hint"))}</span></div><div class="inbox-list">${rows.join("")}</div></section>`
  }

  function graph(m) {
    const W = 164, H = 64, GX = 64, GY = 12, LABEL = 116, LPAD = 14
    const levels = Math.max(0, ...m.items.map((it) => m.level.get(it.id))) + 1
    // Lay items out per lane and level; a lane is as tall as its busiest level
    const lanes = m.groups.map((g) => ({ g, cells: Array.from({ length: levels }, () => []) }))
    const laneOf = (it) => lanes.find((l) => l.g.id === m.gOf(it).id)
    for (const id of m.order) laneOf(m.get.get(id)).cells[m.level.get(id)].push(id)
    const used = lanes.filter((l) => l.cells.some((c) => c.length))
    let y = 8
    const pos = new Map()
    const avgY = (id) => { const ds = (m.get.get(id).deps || []).filter((x) => pos.has(x)); return ds.length ? ds.reduce((a, x) => a + pos.get(x).y, 0) / ds.length : 0 }
    for (const lane of used) {
      const rows = Math.max(...lane.cells.map((c) => c.length))
      lane.top = y
      lane.height = LPAD * 2 + rows * H + (rows - 1) * GY
      lane.cells.forEach((cell, lv) => {
        cell.sort((a, b) => avgY(a) - avgY(b)) // order within a lane by the dependencies' vertical position to cut crossings
        const offset = ((rows - cell.length) * (H + GY)) / 2
        cell.forEach((id, i) => pos.set(id, { x: LABEL + lv * (W + GX), y: y + LPAD + offset + i * (H + GY) }))
      })
      y += lane.height
    }
    const width = LABEL + levels * W + (levels - 1) * GX + 14
    const height = y + 8
    const critEdge = new Set()
    for (let i = 1; i < m.crit.length; i++) critEdge.add(m.crit[i - 1] + ">" + m.crit[i])
    let edges = ""
    for (const it of m.items) for (const dep of it.deps || []) {
      const a = pos.get(dep), b = pos.get(it.id)
      if (!a || !b) continue
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 2, y2 = b.y + H / 2
      const from = m.get.get(dep)
      const cls = [
        critEdge.has(dep + ">" + it.id) ? "crit" : "",
        it.st === "in-flight" && from.st === "passed" ? "flow" : from.st === "passed" ? "done" : "",
        it.st === "blocked" && from.st === "passed" ? "wait" : ""
      ].join(" ")
      const c = Math.max(36, (x2 - x1) * 0.5)
      edges += `<path class="edge ${cls}" data-a="${esc(dep)}" data-b="${esc(it.id)}" d="M${x1} ${y1} C${x1 + c} ${y1}, ${x2 - c} ${y2}, ${x2} ${y2}"/>`
    }
    const laneEls = used.map((l) => `<div class="lane" style="top:${l.top}px;height:${l.height}px;--lc:${esc(l.g.color)}"><div class="lane-label"><b class="${IMG[l.g.icon] ? "has-ic" : ""}">${IMG[l.g.icon] ? icon(l.g.icon, 24) : ""}${esc(l.g.label)}</b>${l.g.hint ? `<span>${esc(l.g.hint)}</span>` : ""}</div></div>`).join("")
    const nodes = m.items.map((it) => {
      const p = pos.get(it.id)
      if (!p) return ""
      const tags = [m.cuts.has(it.id) ? `<span class="tag cut">${esc(t("cut"))}</span>` : "", it.human ? `<span class="tag human">${esc(t("human"))}</span>` : "", it["discovered-from"] ? `<span class="tag new">${esc(t("new"))}</span>` : ""].join("")
      const meta = [it.issue ? `#${it.issue}` : "", it.pr ? `PR #${it.pr}` : "", it.attempts > 1 ? t("attempt_n", { n: it.attempts }) : "", (it.evidence || []).length ? t("evidence_n", { n: it.evidence.length }) : ""].filter(Boolean).join(" · ")
      return `<button type="button" class="node s-${it.st} ${m.critSet.has(it.id) ? "crit" : ""} ${selected === it.id ? "sel" : ""}" data-id="${esc(it.id)}" style="left:${p.x}px;top:${p.y}px">
        <span class="r1"><span class="ic">${ICON[it.st]}</span><span class="id">${esc(it.id)}</span><span class="stt">${esc(ST(it.st))}</span><span class="tags">${tags}</span></span>
        <span class="ttl">${esc(it.title || it.desc)}</span>
        <span class="meta">${esc(meta || it.desc)}</span>
      </button>`
    }).join("")
    const critTxt = m.crit.length
      ? `${esc(t("crit"))} ${m.crit.map((id) => `<span class="mono">${esc(id)}</span>`).join(" → ")}${m.cuts.size ? `　${esc(t("cut"))} ${[...m.cuts].map((id) => esc(t("cut_item", { id, n: m.blocking.get(id) }))).join(", ")}` : ""}`
      : esc(t("all_passed"))
    return `
      <section class="board" aria-label="${esc(t("graph_title"))}">
        <div class="board-head"><div><h2>${esc(t("graph_title"))}</h2><span class="hint">${esc(t("graph_hint"))}</span></div>
          <div class="legend">${["passed", "in-flight", "blocked", "failed", "ready", "pending"].map((s) => `<span class="s-${s}"><i></i>${esc(ST(s))}</span>`).join("")}<span><i class="crit-key"></i>${esc(t("crit"))}</span></div>
        </div>
        <div class="graph-scroll"><div class="graph-fit" data-w="${width}" data-h="${height}"><div class="graph" id="graph" style="width:${width}px;height:${height}px">
          ${laneEls}
          <svg class="edges" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true">${edges}</svg>
          ${nodes}
        </div></div></div>
        <div class="crit-line">${critTxt}</div>
      </section>`
  }

  function tabs(m) {
    const d = m.d
    const T = [["done", "var(--ok)"], ["spec", "var(--brand)"], ["activity", "var(--run)"], ["list", "var(--wait)"], ["data", "var(--fg-3)"]]
    let body = ""
    if (tab === "done") {
      body = `<ul class="dw">${(d.done_when || []).map((c) => {
        const its = (c.items || []).map((id) => m.get.get(id)).filter(Boolean)
        const ok = its.filter((it) => it.st === "passed").length
        const on = c.passes === true || (its.length > 0 && ok === its.length)
        return `<li><span class="ck ${on ? "on" : ""}">${on ? "✓" : ""}</span><div><div>${esc(c.text)}</div><div class="chk">${esc(c.check)}</div></div><div style="text-align:right;font-size:12px;color:var(--fg-3)">${its.length ? `${ok} / ${its.length}<div class="bar"><span style="width:${(ok / its.length) * 100}%"></span></div>` : ""}</div></li>`
      }).join("")}</ul>`
    } else if (tab === "spec") {
      const box = (title, color, xs) => `<div class="box" style="--bc:${color}"><h4>${esc(title)}</h4><ul>${(xs || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      body = `<p style="margin:0 0 12px;color:var(--fg-2)">${esc(d.goal?.statement)}</p><div class="grid2">
        ${box(t("spec.allowed"), "var(--ok)", d.envelope?.allowed)}${box(t("spec.forbidden"), "var(--bad)", d.envelope?.forbidden)}
        ${box(t("spec.non_goals"), "var(--fg-3)", d.non_goals)}${box(t("spec.invariants"), "var(--wait)", d.invariants)}
        ${box(t("spec.verify"), "var(--run)", [`${t("spec.orchestrator")}: ${d.verification?.orchestrator || ""}`, `${t("spec.verifier")}: ${d.verification?.verifier || ""}`])}
      </div>`
    } else if (tab === "activity") {
      const dec = (d.decisions || []).slice().reverse().map((x) => `<li><span class="when">${esc(x.when)}</span><span>${esc(x.text)}</span></li>`).join("")
      const log = (d.log || []).map((x) => `<li><span class="when">${esc(x.when)}</span><span><span class="kind" style="--c:${LOG_COLOR[x.kind] || "var(--fg-3)"}">${esc(t(`log_kind.${x.kind}`))}</span>${esc(x.text)}</span></li>`).join("")
      const custom = (d.custom_panels || []).map((p) => `<div class="box" style="--bc:var(--brand)"><h4>${esc(p.title)}</h4>${p.kind === "kv" ? `<ul>${(p.items || []).map(([k, v]) => `<li><b class="mono">${esc(k)}</b>　${esc(v)}</li>`).join("")}</ul>` : p.kind === "list" ? `<ul>${(p.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div>${esc(p.text)}</div>`}</div>`).join("")
      const none = `<li class="empty">${esc(t("none"))}</li>`
      body = `<div class="grid2"><div><h4 style="margin:0 0 10px;font-size:12.5px;color:var(--fg-3)">${esc(t("decisions"))}</h4><ul class="tl">${dec || none}</ul></div><div><h4 style="margin:0 0 10px;font-size:12.5px;color:var(--fg-3)">${esc(t("recent"))}</h4><ul class="tl">${log || none}</ul></div>${custom}</div>`
    } else if (tab === "list") {
      const rows = m.items.slice().sort((a, b) => ORDER.indexOf(a.st) - ORDER.indexOf(b.st)).map((it) => `<tr data-open="${esc(it.id)}"><td><span class="pill s-${it.st}">${esc(ST(it.st))}</span></td><td class="mono">${esc(it.id)}</td><td><b>${esc(it.title)}</b><div style="color:var(--fg-2);font-size:12.5px">${esc(it.desc)}</div></td><td><span class="gchip" style="--lc:${esc(m.gOf(it).color)}">${esc(m.gOf(it).label)}</span></td><td class="mono" style="font-size:12px">${(it.deps || []).map(esc).join(" ") || "—"}</td></tr>`).join("")
      const cols = (L.list_cols || ["Status", "ID", "Item", "Lane", "Depends on"]).map((c) => `<th>${esc(c)}</th>`).join("")
      body = `<div class="tbl"><table><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div>`
    } else {
      body = `<p style="margin:0;color:var(--fg-2)">${esc(t("data_note"))}</p><pre class="raw">${esc(JSON.stringify(d, null, 2))}</pre>`
    }
    return `<section class="tabs"><div class="tabbar" role="tablist">${T.map(([k, c]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}" style="--tc:${c}"><i></i>${esc(t(`tabs.${k}`))}</button>`).join("")}</div><div class="panel" role="tabpanel">${body}</div></section>`
  }

  function drawer(m) {
    const el = document.getElementById("drawer"), scrim = document.getElementById("scrim")
    const it = selected && m.get.get(selected)
    el.classList.toggle("on", !!it); scrim.classList.toggle("on", !!it); el.setAttribute("aria-hidden", String(!it))
    if (!it) return
    const g = m.gOf(it)
    const chip = (id) => { const x = m.get.get(id); return x ? `<button type="button" class="chip s-${x.st}" data-open="${esc(id)}"><span class="mono">${esc(id)}</span>${esc(x.title)}</button>` : "" }
    const kids = m.children.get(it.id) || []
    const repo = m.d.goal?.repo
    el.className = `drawer on s-${it.st}`
    el.innerHTML = `
      <div class="dh">
        <div class="row"><span class="pill">${esc(ST(it.st))}</span><span class="mono" style="color:var(--fg-3)">${esc(it.id)}</span><span class="gchip" style="--lc:${esc(g.color)}">${esc(g.label)}</span><button type="button" class="x" data-close aria-label="${esc(t("drawer.close"))}">×</button></div>
        <h3>${esc(it.title)}</h3>
        <div style="color:var(--fg-2);font-size:13px">${esc(it.desc)}</div>
      </div>
      <div class="db">
        ${it.question ? `<div class="blk"><div class="lbl">${esc(t("drawer.decide"))}</div><div class="askbox">${esc(it.question)}</div></div>` : ""}
        <div class="blk"><div class="lbl">${esc(t("drawer.verify"))}</div><div class="verify">${esc(it.verify)}</div></div>
        <div class="blk"><div class="lbl">${esc(t("drawer.evidence"))}${it.attempts ? ` · ${esc(t("drawer.attempt", { n: it.attempts }))}` : ""}</div>${(it.evidence || []).length ? `<ul class="ev">${it.evidence.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : `<div class="empty">${esc(t("drawer.no_evidence"))}</div>`}</div>
        <div class="blk"><div class="lbl">${esc(t("drawer.deps"))}</div><div class="chips">${(it.deps || []).map(chip).join("") || `<span class="empty">${esc(t("drawer.deps_none"))}</span>`}</div></div>
        <div class="blk"><div class="lbl">${esc(t("drawer.blocks"))}</div><div class="chips">${kids.map(chip).join("") || `<span class="empty">${esc(t("drawer.blocks_none"))}</span>`}</div></div>
        ${it["discovered-from"] ? `<div class="blk"><div class="lbl">${esc(t("drawer.source"))}</div>${esc(t("drawer.source_text", { id: it["discovered-from"] }))}</div>` : ""}
        ${repo && (it.issue || it.pr) ? `<div class="blk links"><div class="lbl">${esc(t("drawer.links"))}</div>${it.issue ? `<a href="https://github.com/${esc(repo)}/issues/${esc(it.issue)}" target="_blank" rel="noopener">Issue #${esc(it.issue)}</a>` : ""}${it.pr ? `<a href="https://github.com/${esc(repo)}/pull/${esc(it.pr)}" target="_blank" rel="noopener">PR #${esc(it.pr)}</a>` : ""}</div>` : ""}
      </div>`
  }

  // The data never changes inside the page, so the board is built once; tabs, the drawer and the theme update in place
  let current = null
  function mount() {
    const app = document.getElementById("app")
    if (!DATA) { app.innerHTML = `<div class="attn-empty" style="color:var(--bad)">${esc(t("error_data"))}</div>`; return }
    if (DATA.theme?.accent) document.documentElement.style.setProperty("--brand", DATA.theme.accent)
    if (DATA.goal?.title) document.title = `${DATA.goal.title} · Long Horizon`
    current = model(DATA)
    app.innerHTML = header(current) + attention(current) + graph(current) + `<div id="tabs-slot">${tabs(current)}</div>`
    fitGraph()
    requestAnimationFrame(fitGraph)
  }
  function renderTabs() {
    const slot = document.getElementById("tabs-slot")
    if (slot) slot.innerHTML = tabs(current)
  }
  function select(id) {
    selected = id
    document.querySelectorAll(".node.sel").forEach((n) => n.classList.remove("sel"))
    if (id) document.querySelector(`.node[data-id="${CSS.escape(id)}"]`)?.classList.add("sel")
    drawer(current)
  }
  function setTheme(v) {
    if (v === "system") delete document.documentElement.dataset.theme
    else document.documentElement.dataset.theme = v
    store.set("lh.theme", v)
    const cur = document.documentElement.dataset.theme || "system"
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === cur)))
  }

  // Scale the graph down to fit (no smaller than 0.8); scroll sideways only beyond that
  function fitGraph() {
    const scroller = document.querySelector(".graph-scroll"), fit = document.querySelector(".graph-fit"), g = document.getElementById("graph")
    if (!scroller || !fit || !g) return
    const w = Number(fit.dataset.w), h = Number(fit.dataset.h)
    const avail = scroller.clientWidth - 2
    const s = w <= avail ? 1 : Math.max(0.8, avail / w)
    g.style.transform = s < 1 ? `scale(${s})` : ""
    fit.style.width = `${Math.floor(w * s)}px`
    fit.style.height = `${Math.ceil(h * s)}px`
  }
  window.addEventListener("resize", fitGraph)

  function focusLineage(id) {
    const g = document.getElementById("graph")
    if (!g || !current) return
    if (!id) { g.classList.remove("focus"); g.querySelectorAll(".hl").forEach((n) => n.classList.remove("hl")); return }
    const keep = new Set([id, ...current.up(id), ...current.down(id)])
    g.classList.add("focus")
    g.querySelectorAll(".node").forEach((n) => n.classList.toggle("hl", keep.has(n.dataset.id)))
    g.querySelectorAll(".edge").forEach((e) => e.classList.toggle("hl", keep.has(e.dataset.a) && keep.has(e.dataset.b)))
  }

  document.addEventListener("mouseover", (e) => { const n = e.target.closest?.(".node"); if (n) focusLineage(n.dataset.id) })
  document.addEventListener("mouseout", (e) => { const n = e.target.closest?.(".node"); if (n && !n.contains(e.relatedTarget)) focusLineage(null) })
  document.addEventListener("click", (e) => {
    const el = e.target
    const th = el.closest("[data-theme-set]"); if (th) { setTheme(th.dataset.themeSet); return }
    const tb = el.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; store.set("lh.tab", tab); renderTabs(); return }
    const jump = el.closest("[data-jump]"); if (jump) { const first = current.items.find((it) => it.st === jump.dataset.jump); if (first) select(first.id); return }
    const op = el.closest("[data-open]"); if (op) { select(op.dataset.open); return }
    const node = el.closest(".node"); if (node) { select(node.dataset.id); return }
    if (el.closest("[data-close]") || el.id === "scrim") select(null)
  })
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) select(null) })
  mount()
})()
</script>

</body>
</html>
