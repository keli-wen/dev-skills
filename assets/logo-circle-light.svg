<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Rondo — circle, light</title>
  <desc id="desc">Circular light badge: three expanding eccentric rings tangent to a single refrain anchor on warm white, with a lit terracotta return arc.</desc>

  <defs>
    <radialGradient id="bgCL" gradientUnits="userSpaceOnUse" cx="200" cy="140" r="560">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f2f1eb"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bgCL)"/>
  <circle cx="256" cy="256" r="253" fill="none" stroke="#1d1c1a" stroke-opacity="0.1" stroke-width="2"/>

  <g transform="rotate(-28 256 256)" fill="none" stroke-linecap="round">
    <circle cx="282" cy="256" r="136" stroke="#1d1c1a" stroke-opacity="0.22" stroke-width="14"/>
    <circle cx="242" cy="256" r="96" stroke="#1d1c1a" stroke-opacity="0.55" stroke-width="16"/>
    <circle cx="202" cy="256" r="56" stroke="#1d1c1a" stroke-width="18"/>
    <path d="M 146 256 A 136 136 0 1 1 378 352" stroke="#c4623f" stroke-width="16"/>
    <circle cx="146" cy="256" r="28" fill="#fbfaf7" stroke="#1d1c1a" stroke-width="14"/>
    <circle cx="146" cy="256" r="12" fill="#c4623f"/>
  </g>
