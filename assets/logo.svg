  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="#f7f7f4" stroke-opacity="0.06" stroke-width="2"/>

  <g fill="none" stroke="#f7f7f4" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
