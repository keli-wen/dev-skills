<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Rondo skills overview">
  <title>Rondo skills overview</title>
  <style>
    .surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
    .node    { fill: #ffffff; stroke: rgba(11,11,11,0.10); }
    .frame   { fill: none; stroke: #898781; stroke-dasharray: 5 5; }
    .ink  { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #898781; }
    .halo { paint-order: stroke; stroke: #fcfcfb; stroke-width: 4; }
    .edge { fill: none; stroke: #898781; stroke-width: 1.6; }
    .edge-soft { stroke-dasharray: 4 4; }
    .acc-blue   { fill: #2a78d6; }
    .acc-orange { fill: #eb6834; }
    .acc-aqua   { fill: #1baf7a; }
    .acc-yellow { fill: #eda100; }
    .acc-mode   { fill: #898781; }
    .label-bg   { fill: #fcfcfb; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
      .node    { fill: #232322; stroke: rgba(255,255,255,0.10); }
      .ink  { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .halo { stroke: #1a1a19; }
      .acc-blue   { fill: #3987e5; }
      .acc-orange { fill: #d95926; }
      .acc-aqua   { fill: #199e70; }
      .acc-yellow { fill: #c98500; }
      .label-bg   { fill: #1a1a19; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#898781"/>
    </marker>
  </defs>

  <rect class="surface" x="0.5" y="0.5" width="879" height="619" rx="14"/>

  <text class="ink" x="32" y="44" font-size="19" font-weight="650">Skills overview</text>
  <text class="ink2" x="32" y="68" font-size="12.5">Dependencies only point at more basic skills, so they never form cycles. Modes sit outside the chain and switch how the agent works.</text>

  <!-- modes: lowband and readout — their cards sit on the wrapper they apply to -->
  <rect class="frame" x="32" y="110" width="608" height="476" rx="12"/>
  <rect class="label-bg" x="496" y="104" width="126" height="14"/>
  <text class="ink2" x="502" y="115" font-size="11.5">switch agent behavior</text>
  <g>
    <rect class="node" x="52" y="81" width="210" height="58" rx="9"/>
    <rect class="acc-mode" x="62" y="95" width="4" height="30" rx="2"/>
    <text class="mono ink" x="76" y="106" font-size="14" font-weight="600">lowband</text>
    <text class="ink2" x="76" y="124" font-size="11">works in low-bandwidth mode</text>
  </g>
  <g>
    <rect class="node" x="286" y="81" width="210" height="58" rx="9"/>
    <rect class="acc-mode" x="296" y="95" width="4" height="30" rx="2"/>
    <text class="mono ink" x="310" y="106" font-size="14" font-weight="600">readout</text>
    <text class="ink2" x="310" y="124" font-size="11">makes agent replies readable</text>
  </g>

  <!-- edges -->
  <path class="edge edge-soft" d="M400,214 C450,232 498,248 520,265" marker-end="url(#arrow)"/>
  <path class="edge edge-soft" d="M268,214 C205,244 175,300 155,382" marker-end="url(#arrow)"/>
  <path class="edge edge-soft" d="M240,188 C130,196 52,254 52,340 C52,430 110,510 148,528" marker-end="url(#arrow)"/>
  <path class="edge edge-soft" d="M440,188 C560,196 626,254 626,320 C626,360 606,390 580,402" marker-end="url(#arrow)"/>
  <path class="edge" d="M262,326 C240,352 195,368 165,383" marker-end="url(#arrow)"/>
  <path class="edge" d="M376,326 C416,348 474,362 502,383" marker-end="url(#arrow)"/>
  <path class="edge" d="M320,326 C332,380 332,450 276,500" marker-end="url(#arrow)"/>
  <path class="edge" d="M160,444 C170,468 188,486 205,500" marker-end="url(#arrow)"/>
  <path class="edge" d="M530,326 C529,346 528,364 528,382" marker-end="url(#arrow)"/>

  <text class="muted halo" x="446" y="234" font-size="11">refine spec</text>
  <text class="muted halo" x="172" y="300" font-size="11" text-anchor="end">dispatch work</text>
  <text class="muted halo" x="150" y="184" font-size="11" text-anchor="end">final handoff</text>
  <text class="muted halo" x="496" y="186" font-size="11">distill findings</text>
  <text class="muted halo" x="452" y="348" font-size="11">file findings</text>
  <text class="muted halo" x="338" y="432" font-size="11">hand off task</text>
  <text class="muted halo" x="180" y="482" font-size="11" text-anchor="end">escalate to handoff</text>
  <text class="muted halo" x="538" y="352" font-size="11">write decisions</text>

  <!-- layer 0: durable execution -->
  <g>
    <rect class="node" x="240" y="156" width="200" height="58" rx="9"/>
    <rect class="acc-yellow" x="250" y="170" width="4" height="30" rx="2"/>
    <text class="mono ink" x="264" y="181" font-size="14" font-weight="600">long-horizon</text>
    <text class="ink2" x="264" y="199" font-size="11">delivers a goal end to end</text>
  </g>

  <!-- layer 1: entry orchestrators -->
  <g>
    <rect class="node" x="218" y="268" width="196" height="58" rx="9"/>
    <rect class="acc-blue" x="228" y="282" width="4" height="30" rx="2"/>
    <text class="mono ink" x="242" y="293" font-size="14" font-weight="600">ctx-research</text>
    <text class="ink2" x="242" y="311" font-size="11">context-first deep research</text>
  </g>
  <g>
    <rect class="node" x="452" y="268" width="156" height="58" rx="9"/>
    <rect class="acc-blue" x="462" y="282" width="4" height="30" rx="2"/>
    <text class="mono ink" x="476" y="293" font-size="14" font-weight="600">ctx-grill</text>
    <text class="ink2" x="476" y="311" font-size="11">context-aware grilling</text>
  </g>

  <!-- layer 2 -->
  <g>
    <rect class="node" x="72" y="386" width="170" height="58" rx="9"/>
    <rect class="acc-orange" x="82" y="400" width="4" height="30" rx="2"/>
    <text class="mono ink" x="96" y="411" font-size="14" font-weight="600">fan-out</text>
    <text class="ink2" x="96" y="429" font-size="11">multi-agent work mode</text>
  </g>
  <g>
    <rect class="node" x="436" y="386" width="140" height="58" rx="9"/>
    <rect class="acc-blue" x="446" y="400" width="4" height="30" rx="2"/>
    <text class="mono ink" x="460" y="411" font-size="14" font-weight="600">to-ctx</text>
    <text class="ink2" x="460" y="429" font-size="11">persists conclusions</text>
  </g>

  <!-- layer 3 -->
  <g>
    <rect class="node" x="152" y="504" width="160" height="58" rx="9"/>
    <rect class="acc-aqua" x="162" y="518" width="4" height="30" rx="2"/>
    <text class="mono ink" x="176" y="529" font-size="14" font-weight="600">handoff</text>
    <text class="ink2" x="176" y="547" font-size="11">minimal-sufficient context</text>
  </g>

  <!-- legend -->
  <g font-size="11.5">
    <rect class="acc-blue" x="664" y="102" width="12" height="12" rx="3"/>
    <text class="ink2" x="684" y="112">ctx-* family</text>
    <rect class="acc-orange" x="664" y="130" width="12" height="12" rx="3"/>
    <text class="ink2" x="684" y="140">dispatch</text>
    <rect class="acc-aqua" x="664" y="158" width="12" height="12" rx="3"/>
    <text class="ink2" x="684" y="168">handoff</text>
    <rect class="acc-yellow" x="664" y="186" width="12" height="12" rx="3"/>
    <text class="ink2" x="684" y="196">durable execution</text>
    <rect class="acc-mode" x="664" y="214" width="12" height="12" rx="3"/>
    <text class="ink2" x="684" y="224">mode: applies across the chain</text>
    <path class="edge" d="M664,246 L676,246" marker-end="url(#arrow)"/>
    <text class="ink2" x="684" y="250">may use (one-way)</text>
    <path class="edge edge-soft" d="M664,274 L676,274" marker-end="url(#arrow)"/>
    <text class="ink2" x="684" y="278">long-horizon orchestration</text>
  </g>

  <!-- composition -->
  <g>
    <text class="muted" x="664" y="300" font-size="10.5" letter-spacing="1.2">COMPOSE WITH PIPES</text>
    <text class="mono ink2" x="664" y="322" font-size="10.5">/ctx-research … | /to-ctx</text>
    <text class="mono ink2" x="664" y="340" font-size="10.5">/ctx-research … | /handoff</text>
    <text class="mono ink2" x="664" y="358" font-size="10.5">/fan-out … | /to-ctx</text>
    <text class="ink2" x="664" y="384" font-size="10.5">Once on, a mode applies to</text>
    <text class="ink2" x="664" y="399" font-size="10.5">every turn until turned off.</text>
    <text class="ink2" x="664" y="422" font-size="10.5">Paste readout's body into</text>
    <text class="ink2" x="664" y="437" font-size="10.5"><tspan class="mono">AGENTS.md</tspan> / <tspan class="mono">CLAUDE.md</tspan></text>
    <text class="ink2" x="664" y="452" font-size="10.5">to apply without invoking.</text>
  </g>

  <!-- one-shot: covers exactly one turn, outside the flow -->
  <g>
    <text class="muted" x="664" y="512" font-size="10.5" letter-spacing="1.2">ONE-SHOT, NOT A MODE</text>
    <rect class="node" x="664" y="522" width="184" height="58" rx="9"/>
    <rect class="acc-mode" x="674" y="536" width="4" height="30" rx="2"/>
    <text class="mono ink" x="688" y="547" font-size="14" font-weight="600">just-ask</text>
    <text class="ink2" x="688" y="565" font-size="11">agent answers, hands off</text>
  </g>
</svg>
